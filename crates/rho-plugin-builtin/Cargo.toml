[package]
name = "rho-plugin-builtin"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "rho built-in capability plugins: tools, commands, skills, and MCP client"
license.workspace = true

[dependencies]
rho-core.workspace = true
rho-sdk.workspace = true
async-trait = "0.1"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.0"
thiserror.workspace = true
anyhow = "1.0"
tokio = { workspace = true, features = ["sync", "rt", "process", "io-util", "time"] }
brush-parser = "0.4.0"
url = "2.5"
percent-encoding = "2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
scraper = "0.21"
html2text = "0.14"
feed-rs = "2.3"
quick-xml = "0.37"
csv = "1.3"
pdf-extract = "0.7"
uuid = { workspace = true, features = ["v4"] }
moka = { version = "0.12", features = ["future"] }
regex = "1.11"
rig = "0.42"
