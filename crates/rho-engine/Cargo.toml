[package]
name = "rho-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "rho turn orchestration, provider assembly, and credential custody"
license.workspace = true

[dependencies]
rho-core.workspace = true
rho-host.workspace = true
rho-plugin-providers.workspace = true
rho-sdk.workspace = true
async-trait.workspace = true
futures.workspace = true
rig = { version = "0.42", features = ["test-utils"] }
rig-memory = "0.42"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, default-features = false, features = ["sync", "rt", "macros", "time", "fs", "process", "io-util"] }
uuid.workspace = true
chrono = { version = "0.4", features = ["serde"] }
thiserror.workspace = true
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
rig = { version = "0.42", features = ["test-utils"] }
