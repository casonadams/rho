[package]
name = "rho-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "rho turn orchestration, provider assembly, tools, and MCP runtime"
license.workspace = true
repository.workspace = true

[dependencies]
rho-harness-core.workspace = true
async-trait.workspace = true
futures.workspace = true
rig = { version = "0.42", features = ["test-utils"] }
rig-memory = "0.42"
serde.workspace = true
serde_json.workspace = true
schemars = "1.0"
tokio = { workspace = true, default-features = false, features = ["sync", "rt", "macros", "time", "fs", "process", "io-util", "net"] }
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
thiserror.workspace = true
anyhow = "1.0"
image.workspace = true
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json", "stream"] }
url = "2.5"
percent-encoding = "2.3"
rand = "0.8"
scraper = "0.21"
html2text = "0.14"
feed-rs = "2.3"
quick-xml = "0.37"
csv = "1.3"
pdf-extract = "0.7"
moka = { version = "0.12", features = ["future"] }
regex = "1.11"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
memchr = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rig = { version = "0.42", features = ["test-utils"] }
tempfile = "3.17"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
