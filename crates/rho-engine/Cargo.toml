[package]
name = "rho-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "rho turn orchestration, provider assembly, tools, and MCP runtime"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
rho-harness-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, default-features = false, features = ["sync", "rt", "macros", "time", "fs", "process", "io-util", "net"] }
uuid = { workspace = true, features = ["v4"] }
tracing = "0.1"
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
image.workspace = true
sha2 = "0.11"
base64.workspace = true
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
percent-encoding = "2.3"
rand = "0.10"
scraper = "0.29"
html2text = "0.17"
feed-rs = "3.0"
quick-xml = "0.42"
csv = "1.3"
encoding_rs = "0.8"
pdf-extract = "0.12"
flate2.workspace = true
moka = { version = "0.12", features = ["future"] }
regex.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
memchr = "2"
similar.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rho-harness-core = { workspace = true, features = ["skip-fsync"] }
rho-test-support.workspace = true
test-case.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
