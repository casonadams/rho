[package]
name = "rho-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "rho turn orchestration, provider assembly, tools, and MCP runtime"
license.workspace = true
repository.workspace = true

[dependencies]
rho-harness-core.workspace = true
async-trait.workspace = true
futures.workspace = true
rig.workspace = true
rig-memory.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.0"
tokio = { workspace = true, default-features = false, features = ["sync", "rt", "macros", "time", "fs", "process", "io-util", "net"] }
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
image.workspace = true
sha2 = "0.10"
base64 = "0.22"
reqwest.workspace = true
rustls.workspace = true
url = "2.5"
percent-encoding = "2.3"
rand = "0.8"
scraper = "0.21"
html2text = "0.14"
feed-rs = "2.3"
quick-xml = "0.41"
csv = "1.3"
pdf-extract = "0.7"
moka = { version = "0.12", features = ["future"] }
regex = "1.11"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
memchr = "2"
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rig.workspace = true
tempfile = "3.17"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
