[workspace]
resolver = "2"
members = [
    ".",
    "crates/rho-harness-core",
    "crates/rho-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cason Adams"]
description = "Minimal, clean agentic coding CLI harness in Rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.43", default-features = false }
uuid = "1.13"
thiserror = "2.0"
anyhow = "1.0"
tiktoken-rs = "0.6"
chrono = { version = "0.4", features = ["serde"] }
rho-harness-core = { version = "0.1.0", path = "crates/rho-harness-core" }
rho-engine = { version = "0.1.0", path = "crates/rho-engine" }

[package]
name = "rho"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[features]
default = ["ui"]
ui = [
    "dep:reedline",
    "dep:inquire",
    "dep:indicatif",
    "dep:crossterm",
    "dep:anstyle",
    "dep:pulldown-cmark",
    "dep:syntect",
    "dep:meraid",
]

[lib]
name = "rho"
path = "src/lib.rs"

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
rho-harness-core.workspace = true
rho-engine.workspace = true

# Async Runtime & Core
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
async-trait.workspace = true

# AI & LLM Engine
rig = "0.42"
rig-memory = "0.42"
schemars = "1.0"
serde.workspace = true
serde_json = "1.0"

# CLI & REPL
clap = { version = "4.5", features = ["derive", "env"] }
reedline = { version = "0.38", optional = true }
inquire = { version = "0.7", optional = true }
indicatif = { version = "0.17", optional = true }
crossterm = { version = "0.28", optional = true }
anstyle = { version = "1.0", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"], optional = true }
meraid = { version = "0.2", optional = true }

# Utilities & Config
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
unicode-width = "0.2"
arboard = "3.4"
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rig = { version = "0.42", features = ["test-utils"] }
reqwest = { version = "0.13", default-features = false }
tempfile = "3.17"
