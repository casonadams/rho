[workspace]
resolver = "2"
members = [
    ".",
    "crates/rho-harness-core",
    "crates/rho-engine",
    "crates/rho-wasm",
]

[workspace.lints.rust]
# Apple ld warns when __eh_frame exceeds Mach-O's 16MB compact-unwind table limit in dev builds.
linker_messages = "allow"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.package]
version = "0.8.0"
edition = "2024"
authors = ["Cason Adams"]
description = "Minimal, clean agentic coding CLI harness in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casonadams/rho"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.43", default-features = false }
uuid = "1.13"
thiserror = "2.0"
anyhow = "1.0"
tiktoken-rs = "0.12"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fuzzy-matcher = "0.3.7"
rho-harness-core = { version = "0.8.0", path = "crates/rho-harness-core" }
rho-engine = { version = "0.8.0", path = "crates/rho-engine" }
rig = { version = "0.42", default-features = false, features = ["agent", "derive", "test-utils"] }
similar = "2.7"
rig-memory = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = "1.0"
tar = "0.4"
toml = "1.1"
toml_edit = "0.25"
iroh = "1.2.0"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
tokio-websockets = { version = "0.13", default-features = false, features = ["server"] }

[package]
name = "rho"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
default = ["ui"]
fastembed = ["rho-engine/fastembed"]
ui = [
    "dep:reedline",
    "dep:inquire",
    "dep:indicatif",
    "dep:crossterm",
    "dep:anstyle",
    "dep:pulldown-cmark",
    "dep:syntect",
    "dep:merman",
    "dep:terminal-colorsaurus",
]

[lib]
name = "rho"
path = "src/lib.rs"

[[bin]]
name = "rho"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
rho-harness-core.workspace = true
rho-engine.workspace = true

# Async Runtime & Core
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
async-trait.workspace = true

# AI & LLM Engine
rig.workspace = true
reqwest.workspace = true
rustls.workspace = true
flate2.workspace = true
tar.workspace = true
rig-memory.workspace = true
schemars = "1.0"
serde.workspace = true
serde_json.workspace = true

# CLI & REPL
iroh.workspace = true
base64.workspace = true
qrcode.workspace = true
tokio-websockets = { workspace = true }
futures-util = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
reedline = { version = "0.51", optional = true }
inquire = { version = "0.9", optional = true, features = ["fuzzy"] }
indicatif = { version = "0.18", optional = true }
crossterm = { version = "0.29", optional = true }
anstyle = { version = "1.0", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"], optional = true }
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["ascii"], optional = true }
terminal-colorsaurus = { version = "1.0", features = ["anstyle"], optional = true }

# Utilities & Config
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher.workspace = true
regex = "1.11"
unicode-width = "0.2"
arboard = "3.4"
similar.workspace = true
image.workspace = true
dirs = "7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rig.workspace = true
reqwest.workspace = true
tempfile = "3.17"
http = "1.0"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.test]
opt-level = 0
debug = 1

[profile.test.package."*"]
opt-level = 0
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
