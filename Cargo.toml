[workspace]
resolver = "2"
members = [".", "crates/rho-sdk", "crates/rho-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cason Adams"]
description = "Minimal, clean agentic coding CLI harness in Rust"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.43", default-features = false }
uuid = "1.13"
jsonschema = { version = "0.52", default-features = false }
thiserror = "2.0"
anyhow = "1.0"
rho-sdk = { path = "crates/rho-sdk" }
rho-core = { path = "crates/rho-core" }

[package]
name = "rho"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[lib]
name = "rho"
path = "src/lib.rs"

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
rho-sdk.workspace = true
rho-core.workspace = true

# Async Runtime & Core
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
async-trait.workspace = true

# AI & LLM Engine
rig = "0.42"
rig-memory = "0.42"
schemars = "1.0"
serde.workspace = true
serde_json = "1.0"

# CLI & REPL
clap = { version = "4.5", features = ["derive", "env"] }
reedline = "0.38"
inquire = "0.7"
indicatif = "0.17"
crossterm = "0.28"
anstyle = "1.0"
pulldown-cmark = "0.13"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

# Web Tools
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
scraper = "0.21"
url = "2.5"
percent-encoding = "2.3"
rand = "0.8"
html2text = "0.14"
feed-rs = "2.3"
quick-xml = "0.37"
csv = "1.3"
pdf-extract = "0.7"
moka = { version = "0.12", features = ["future"] }

# Utilities & Config
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
unicode-width = "0.2"

[dev-dependencies]
rig = { version = "0.42", features = ["test-utils"] }
