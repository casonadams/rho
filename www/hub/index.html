<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rho fleet hub</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="css/hub.css?v=2">
</head>
<body>
  <header class="hub-header">
    <a href="../" class="brand">
      <span>ρ rho</span>
      <span class="brand-badge">fleet hub</span>
    </a>
    <div class="header-actions">
      <a href="https://iroh.computer" target="_blank" rel="noopener" class="powered-by-badge" title="Powered by Iroh peer-to-peer transport">
        <span>powered by</span>
        <span class="iroh-text">iroh</span>
      </a>
      <button class="btn-primary" id="add-node-btn">+ Add Node</button>
    </div>
  </header>

  <main class="hub-main">
    <!-- Fleet Overview View -->
    <section id="fleet-view">
      <div class="fleet-title-row">
        <div>
          <h1>Active Fleet</h1>
          <p class="fleet-subtitle">Zero-cloud peer-to-peer control of your rho nodes, powered by <a href="https://iroh.computer" target="_blank" rel="noopener" class="iroh-link">Iroh</a></p>
        </div>
      </div>
      <div class="node-grid" id="node-grid"></div>
    </section>

    <!-- Node Workspace View (Chat & Sessions) -->
    <section id="workspace-view" style="display: none;">
      <div class="workspace-topbar">
        <div class="workspace-meta">
          <button class="btn-secondary" id="back-to-fleet-btn">← Fleet</button>
          <button class="btn-secondary" id="toggle-sidebar-btn" title="Toggle Sessions Sidebar" style="display: none;">≡</button>
          <strong id="active-node-title">Node</strong>
          <span style="color: var(--text-muted);">|</span>
          <span id="active-node-workspace" style="color: var(--text-secondary); font-size: 0.8rem;">~/workspace</span>
          <span class="working-pill" id="working-pill" style="display: none;"><span class="spinner-ring"></span> working...</span>
        </div>
        <div class="header-actions">
          <button class="btn-secondary" id="auth-btn">Auth / Providers</button>
          <button class="btn-primary" id="new-session-btn" style="display: none;">+ New Session</button>
        </div>
      </div>

      <div class="workspace-layout">
        <aside class="session-sidebar" id="session-sidebar" style="display: none;">
          <div class="sidebar-header">Sessions</div>
          <ul class="session-list" id="session-history-list"></ul>
        </aside>

        <section class="session-chat">
          <div class="chat-transcript" id="chat-transcript"></div>

          <div class="chat-input-divider" id="chat-input-divider">
            <div class="chat-divider-left">
              <span class="chat-divider-act" id="chat-divider-act" style="display: none;">
                <span class="spinner-ring"></span>
                <span class="chat-divider-label" id="chat-divider-label">working</span>
              </span>
            </div>
            <div class="chat-divider-line"></div>
            <div class="chat-divider-right" id="chat-divider-right">rho</div>
          </div>

          <div class="chat-input-bar">
            <textarea id="chat-prompt" rows="1" placeholder="Send prompt to remote node... (Enter to send, Shift+Enter for newline)"></textarea>
            <button class="btn-primary" id="send-prompt-btn">Send</button>
          </div>

          <div class="session-footer" id="session-footer">
            <div class="footer-line top-line">
              <div class="footer-left" id="footer-cwd-info">~/workspace</div>
              <div class="footer-right" id="footer-quota-info"></div>
            </div>
            <div class="footer-line stats-line">
              <div class="footer-left" id="footer-stats-info">↑0 ↓0</div>
              <div class="footer-right" id="footer-model-info"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
