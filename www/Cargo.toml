[package]
name = "rho-www"
description = "The rho website: an nsh app published to GitHub Pages."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The site builds for wasm with nsh, apart from the rho workspace and its toolchain.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
log = "0.4"
nsh-core = "0.6.1"
nsh-base = { version = "0.6.1", default-features = false, features = ["highlight"] }

# The browser draws SVG itself; the native builds (nsh package's describe step, tests) need resvg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nsh-core = { version = "0.6.1", features = ["svg"] }

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = "0.6.1"
