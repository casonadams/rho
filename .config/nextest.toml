[profile.default]
# Show failures, retries, slow and leaky tests but not the PASS line of each of ~2700 tests; `V=1 mise run test` shows them.
status-level = "leak"
# AGENTS.md caps a test at 2.5 s; a test still running at 10 s is hung, so fail it by name instead of stalling `mise run all`.
slow-timeout = { period = "5s", terminate-after = 2 }

[[profile.default.overrides]]
# Worktree tests spawn dozens of git processes; reserving threads keeps them under the 2.5 s per-test ceiling under full-suite load.
filter = 'test(/worktree/)'
threads-required = 2
