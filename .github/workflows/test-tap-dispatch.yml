name: Test Homebrew Dispatch

on:
  workflow_dispatch:

jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch test event to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "ERROR: HOMEBREW_TAP_TOKEN secret is not set in this repository!"
            exit 1
          fi

          response=$(curl -s -w "%{http_code}" -o response.txt -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/casonadams/homebrew-tap/dispatches \
            -d '{"event_type":"rho-release","client_payload":{"tag":"v0.6.0"}}')

          echo "HTTP response status: $response"
          cat response.txt

          if [ "$response" = "204" ]; then
            echo "SUCCESS: HOMEBREW_TAP_TOKEN is working and successfully triggered casonadams/homebrew-tap!"
          else
            echo "ERROR: Dispatch failed with status code $response"
            exit 1
          fi
