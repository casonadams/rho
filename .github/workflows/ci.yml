name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (production code)
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Run clippy (tests)
        run: cargo clippy --workspace --tests -- -A clippy::cognitive_complexity -A clippy::too_many_lines -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: |
          cargo test --workspace --all-targets 2>&1 | tee /tmp/test.log || {
            echo "## Test Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E -B 2 -A 15 '(failures:|FAILED|panicked at)' /tmp/test.log | head -n 100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run doc tests
        run: cargo test --workspace --doc

  coverage-crap:
    name: Coverage & CRAP Metric
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov & cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-binstall

      - name: Install cargo-crap
        run: |
          cargo binstall --no-confirm --force cargo-crap@0.5.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo crap --version
      - name: Generate test coverage trace
        id: coverage
        run: make coverage

      - name: Emit GitHub PR annotations
        if: always() && steps.coverage.outcome == 'success'
        run: cargo crap --path . --lcov target/lcov.info --format github

      - name: Publish CRAP summary to Step Summary
        if: always() && steps.coverage.outcome == 'success'
        run: cargo crap --path . --lcov target/lcov.info --threshold 30 --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Gate on CRAP threshold
        run: make crap
