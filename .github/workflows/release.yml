name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: "Release Please"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  update-workspace:
    name: "Update Cargo.lock on Release PR"
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    permissions:
      contents: write
    uses: ./.github/workflows/lock-sync.yml
    with:
      name: release-pr
      ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      message: "chore: update Cargo.lock for release"

  publish-crates:
    name: "Publish to crates.io"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dependency build scripts run here, before the publish token exists.
      - name: Verify the package build
        run: cargo package -p rho-harness-core --allow-dirty

      - name: Exchange OIDC token for a short-lived publish token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p rho-harness-core --no-verify --allow-dirty
          sleep 15
          cargo publish -p rho-engine --no-verify --allow-dirty
          sleep 15
          cargo publish -p rho --no-verify --allow-dirty

  build-release:
    name: "Build ${{ matrix.target }}"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          name="rho-${TAG#v}-${{ matrix.target }}"
          tar czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" rho

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = "rho-$($env:TAG.Substring(1))-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/rho.exe" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  upload-assets:
    name: "Upload release assets"
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Upload to the release
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber

  checksums:
    name: "Generate SHA256SUMS"
    needs: [release-please, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release assets
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Generate and upload SHA256SUMS
        run: |
          rm -f dist/SHA256SUMS
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber

  sync-lock:
    name: "Sync Cargo.lock on main after release"
    needs: [release-please, upload-assets]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/lock-sync.yml
    with:
      name: main
      message: "chore: sync Cargo.lock after ${{ needs.release-please.outputs.tag_name }}"

  update-homebrew:
    name: "Dispatch Homebrew tap update"
    needs: [release-please, checksums]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger formula update in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            curl -fsS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TAP_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/casonadams/homebrew-tap/dispatches \
              -d '{"event_type":"rho-release","client_payload":{"tag":"'"$TAG"'"}}'
            echo "Successfully dispatched rho-release event to casonadams/homebrew-tap"
          else
            echo "HOMEBREW_TAP_TOKEN not configured; relying on weekly sync or manual workflow dispatch"
          fi
